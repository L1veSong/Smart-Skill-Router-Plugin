<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>智配路由</title>
<style>
/* ══════════════════════════════════════════════════════════
   finesse-ui · product register · canonical sidebar shell
   Set 11 Midnight & Amber · product-ui.md §0 §1
   ══════════════════════════════════════════════════════════ */
:root {
  --page:  #08090f;
  --rail:  #0b0c14;
  --rail-2:#13151f;
  --bg:    #12141c;
  --panel-2:#1a1d27;
  --border:rgba(255,255,255,.06);
  --ink-1: #eceef5;
  --ink-2: #a8adbd;
  --ink-3: #848aa0;
  --accent:#E8A33D;
  --accent-soft:rgba(232,163,61,.13);
  --on-accent:#141008;
  --up:  #3FCB86;
  --down:#FF5F56;
  --warn:#E8A33D;
  --shadow:0 1px 3px rgba(0,0,0,.4);
  --shadow-lg:0 40px 90px -50px rgba(0,0,0,.75);
  --r:  14px; --r-sm:8px; --r-lg:20px; --r-pill:99px;
  --font:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:"SF Mono","Fira Code","Cascadia Code",ui-monospace,monospace;
  --green:var(--up); --red:var(--down);
}
body[data-theme="light"] {
  --page:  #f4f1ea; --rail:#ece8de; --rail-2:#f7f4ed;
  --bg:    #ffffff; --panel-2:#f9f7f1;
  --border:rgba(40,30,18,.07);
  --ink-1: #1b1710; --ink-2:#534d41; --ink-3:#8a8272;
  --accent:#c47d20; --accent-soft:rgba(196,125,32,.11); --on-accent:#fff;
  --green:#3d8c5c; --red:#d9443c;
  --shadow:0 1px 3px rgba(40,30,18,.045);
  --shadow-lg:0 40px 90px -50px rgba(40,30,18,.25);
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:15px;-webkit-font-smoothing:antialiased}
body{font-family:var(--font);background:var(--page);color:var(--ink-1);min-height:100vh;line-height:1.55}

/* ═══ Layout ═══ */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{
  width:240px;flex-shrink:0;background:var(--rail);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:22px 16px 18px;
}
.sidebar-brand{
  font-size:.82rem;font-weight:650;letter-spacing:-.01em;
  color:var(--ink-1);margin-bottom:28px;padding:0 6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sidebar-nav{flex:1;display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:var(--r-sm);
  border:none;background:none;color:var(--ink-3);
  font-size:.8rem;font-family:var(--font);font-weight:500;
  cursor:pointer;transition:background .12s,color .12s;text-align:left;width:100%;
}
.nav-item:hover{background:var(--rail-2);color:var(--ink-2)}
.nav-item.active{background:var(--accent-soft);color:var(--accent)}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;transition:background .3s}
.dot.on{background:var(--up)}
.dot.off{background:var(--down)}

.sidebar-footer{
  border-top:1px solid var(--border);padding-top:14px;margin-top:auto;
}
.sidebar-status{
  display:flex;align-items:center;gap:8px;padding:6px 8px;
  font-size:.6875rem;color:var(--ink-3);font-family:var(--mono);
}
.sidebar-actions{display:flex;gap:4px;margin-top:10px}

/* ═══ Main ═══ */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
  height:52px;display:flex;align-items:center;justify-content:flex-end;
  padding:0 28px;border-bottom:1px solid var(--border);gap:8px;
  background:var(--rail);
}
.breadcrumb{font-size:.75rem;color:var(--ink-3);margin-right:auto;font-family:var(--mono)}
.content{padding:24px 28px 44px;overflow-y:auto;flex:1}
.tab-content{display:none}
.tab-content.active{display:block}

/* ═══ Components ═══ */
.btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:6px 14px;border-radius:var(--r-sm);
  border:1px solid var(--border);background:var(--panel-2);
  color:var(--ink-2);cursor:pointer;
  font-size:.75rem;font-family:var(--font);font-weight:500;
  transition:background .12s,border-color .12s,color .12s;white-space:nowrap;
}
.btn:hover{background:rgba(255,255,255,.04);color:var(--ink-1)}
.btn:active{transform:scale(.98)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-accent:hover{filter:brightness(1.12)}
.btn-danger{color:var(--down);border-color:rgba(255,107,90,.14)}
.btn-danger:hover{background:rgba(255,107,90,.07)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--panel-2)}
.btn-sm{padding:3px 10px;font-size:.6875rem;border-radius:6px}
.btn-icon{padding:6px 8px}

/* KPI Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.stat-card{
  background:var(--bg);border:1px solid var(--border);
  border-radius:var(--r);padding:20px 24px;
  transition:border-color .15s;box-shadow:var(--shadow);
  display:flex;flex-direction:column;justify-content:center;
}
.stat-card:hover{border-color:rgba(232,163,61,.12)}
.stat-label{
  font-size:.6875rem;font-weight:500;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;
}
.stat-value{
  font-size:1.5rem;font-weight:700;letter-spacing:-.02em;
  font-family:var(--mono);font-variant-numeric:tabular-nums;
}
.stat-sub{font-size:.6875rem;color:var(--ink-3);font-family:var(--mono);margin-top:2px}

/* Search */
.search-bar{display:flex;gap:8px;margin-bottom:16px}
.search-bar input{
  flex:1;background:var(--panel-2);border:1px solid var(--border);
  color:var(--ink-1);padding:9px 14px;border-radius:var(--r-sm);
  font-size:.8125rem;font-family:var(--font);transition:border-color .15s;
}
.search-bar input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search-bar input::placeholder{color:var(--ink-3)}
.search-info{font-size:.75rem;color:var(--ink-3);margin-bottom:14px}

/* Rule Cards */
.cards-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.rule-card{
  background:var(--bg);border:1px solid var(--border);
  border-radius:var(--r);padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  transition:border-color .15s;box-shadow:var(--shadow);
}
.rule-card:hover{border-color:rgba(232,163,61,.14)}
.rule-left{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.rule-pattern{
  font-family:var(--mono);font-size:.8rem;color:var(--ink-1);
  word-break:break-all;line-height:1.4;min-width:0;
}
.rule-hits{
  display:inline-flex;align-items:center;padding:2px 8px;border-radius:var(--r-pill);
  font-size:.6875rem;font-family:var(--mono);font-weight:500;
  background:rgba(255,255,255,.05);color:var(--ink-3);flex-shrink:0;
}
.rule-hits.hot{background:var(--accent-soft);color:var(--accent)}
.rule-actions{display:flex;gap:4px;opacity:0;transition:opacity .12s;flex-shrink:0}
.rule-card:hover .rule-actions{opacity:1}
.show-more{text-align:center;padding:16px;color:var(--ink-3);font-size:.8125rem;cursor:pointer;transition:color .12s}
.show-more:hover{color:var(--accent)}
.empty{text-align:center;padding:64px 0;color:var(--ink-3);font-size:.875rem}

/* Config Cards */
.card{
  background:var(--bg);border:1px solid var(--border);
  border-radius:var(--r);padding:20px 24px;margin-bottom:12px;
  transition:border-color .15s;box-shadow:var(--shadow);
}
.card:hover{border-color:rgba(255,255,255,.08)}
.card h3{font-size:.875rem;font-weight:600;margin-bottom:14px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:.8125rem;color:var(--ink-2)}
.card-row:last-child{border-bottom:0}
.card-row .hint{font-size:.6875rem;color:var(--ink-3)}
.card select,.card input{
  background:var(--panel-2);border:1px solid var(--border);
  color:var(--ink-1);padding:7px 10px;border-radius:var(--r-sm);
  font-size:.8125rem;font-family:var(--font);transition:border-color .15s;
}
.card select:focus,.card input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* Toggle */
.card-row label.switch{margin-left:auto}
.switch{position:relative;display:inline-block;width:38px;height:21px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:rgba(255,255,255,.1);border-radius:21px;transition:background .2s}
.slider::before{content:"";position:absolute;height:15px;width:15px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
input:checked+.slider{background:var(--accent)}
input:checked+.slider::before{transform:translateX(17px)}
.radio-group{display:flex;gap:20px;flex-wrap:wrap}
.radio-group label{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:.8125rem;color:var(--ink-2)}
.radio-group input[type="radio"]{accent-color:var(--accent)}

/* Modal */
.modal{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.65);z-index:100;
  justify-content:center;align-items:center;backdrop-filter:blur(4px);
}
.modal.show{display:flex}
.modal-box{
  background:var(--bg);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:28px;
  width:min(480px,94vw);max-height:90vh;overflow-y:auto;
  box-shadow:var(--shadow-lg);
}
.modal-box h2{font-size:1rem;font-weight:600;margin-bottom:20px}
.modal-box label{display:block;font-size:.6875rem;font-weight:500;color:var(--ink-3);margin-bottom:5px;margin-top:14px;text-transform:uppercase;letter-spacing:.04em;font-family:var(--mono)}
.modal-box input,.modal-box textarea{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--ink-1);padding:9px 11px;border-radius:var(--r-sm);font-size:.8125rem;font-family:var(--font);transition:border-color .15s}
.modal-box input:focus,.modal-box textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.modal-box textarea{min-height:80px;resize:vertical}
.modal-actions{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}

/* Toast */
.toast{
  position:fixed;bottom:32px;left:50%;transform:translateX(-50%);
  background:var(--bg);border:1px solid var(--border);
  color:var(--ink-1);padding:10px 24px;border-radius:var(--r);
  font-size:.8125rem;font-weight:500;
  opacity:0;transition:opacity .25s,transform .25s;
  z-index:200;pointer-events:none;box-shadow:var(--shadow-lg);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.toast.error{border-color:rgba(255,107,90,.22)}

@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.stat-card{animation:reveal .35s ease-out both}
.stat-card:nth-child(1){animation-delay:.04s}
.stat-card:nth-child(2){animation-delay:.10s}
.stat-card:nth-child(3){animation-delay:.16s}

@media(max-width:768px){
  .sidebar{display:none}
  .content{padding:16px 16px 48px}
  .stats{grid-template-columns:1fr}
  .cards-grid{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  .stat-card{animation:none}
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app">
  <!-- ═══ Sidebar ═══ -->
  <aside class="sidebar">
    <div class="sidebar-brand" data-lang="brand">智配路由</div>

      <button class="nav-item tab active" onclick="switchTab('rules')">
        <span data-lang="tab-rules">规则管理</span>

    </div>
    <div class="content">

        <div id="stats-bar" class="stats"></div>
        <div class="search-bar">

          <button class="btn btn-accent" onclick="openAddModal()" data-lang="add-rule">添加规则</button>
          <button class="btn btn-danger" onclick="resetRules()" data-lang="reset-rules">重置</button>
        </div>
        <div class="search-info" id="search-info"></div>
        <div class="cards-grid" id="cards-grid"></div>
      </div>

      <div id="tab-config" class="tab-content">
        <div class="card"><h3 data-lang="pause-label">暂停 SSR</h3><div class="card-row"><span data-lang="pause-desc">暂停后不推荐任何技能</span><label class="switch"><input type="checkbox" id="pause-switch" onchange="togglePause()"><span class="slider"></span></label></div></div>
        <div class="card"><h3 data-lang="mode">推荐模式</h3><div class="radio-group"><label><input type="radio" name="mode" value="suggest" onchange="saveMode()" checked> <span data-lang="suggest">推荐模式</span></label><label><input type="radio" name="mode" value="enforce" onchange="saveMode()"> <span data-lang="enforce">强制模式</span></label></div></div>
        <div class="card"><h3 data-lang="scan">扫描策略</h3><div class="radio-group"><label><input type="radio" name="scan" value="startup" onchange="saveScan()" checked> <span data-lang="scan-startup">启动时扫描</span></label><label><input type="radio" name="scan" value="every_turn" onchange="saveScan()"> <span data-lang="scan-every">每次扫描</span></label></div></div>
        <div class="card"><h3 data-lang="b-layer">B 层后端</h3><div class="card-row"><span data-lang="provider">Provider</span><select id="b-provider" onchange="onBProviderChange()"><option value="main">main</option><option value="openai">openai</option><option value="ollama">ollama</option><option value="lmstudio">lmstudio</option><option value="llamacpp">llamacpp</option></select></div><div class="card-row"><span data-lang="model-label">模型</span><input id="b-model"></div><div class="card-row"><span data-lang="base-url">Base URL</span><input id="b-url"></div><div class="card-row"><span data-lang="timeout">超时 (s)</span><input id="b-timeout" type="number"></div><div class="card-row"><span data-lang="apikey">API Key</span><input id="b-key" type="password"></div><div style="margin-top:16px"><button class="btn btn-accent" onclick="saveB()" data-lang="save">保存（重启生效）</button></div></div>
        <div class="card"><h3 data-lang="gate-model-title">门控模型</h3><div class="card-row"><span data-lang="provider">Provider</span><select id="gate-provider" onchange="onGateProviderChange()"><option value="ollama">ollama</option><option value="main">main</option><option value="openai">openai</option></select></div><div class="card-row"><span data-lang="model-label">模型</span><input id="gate-model"></div><div class="card-row"><span data-lang="gate-enable">启用门控</span><label class="switch"><input type="checkbox" id="gate-enabled"><span class="slider"></span></label></div><div style="margin-top:16px"><button class="btn btn-accent" onclick="saveGate()" data-lang="save">保存（重启生效）</button></div></div>
        <div class="card"><h3 data-lang="emb-title">Embedding 模型</h3><div class="card-row"><span data-lang="provider">Provider</span><select id="emb-provider"><option value="ollama">ollama</option><option value="main">main</option><option value="openai">openai</option><option value="siliconflow">siliconflow</option></select></div><div class="card-row"><span data-lang="model-label">模型</span><input id="emb-model" list="emb-ollama-list"><datalist id="emb-ollama-list"></datalist></div><div class="card-row"><span data-lang="base-url">Base URL</span><input id="emb-url"></div><div class="card-row"><span data-lang="apikey">API Key</span><input id="emb-key" type="password"></div><div style="margin-top:16px"><button class="btn btn-accent" onclick="saveEmb()" data-lang="save-rebuild">保存（重建索引）</button></div></div>
        <div class="card"><h3 data-lang="behavior-title">行为设置</h3><div class="card-row"><span data-lang="llm-screen-label">LLM 二次筛选</span> <small class="hint"><span data-lang="hint-llm-screen">A 层匹配后再让 LLM 复核</span></small><label class="switch"><input type="checkbox" id="llm-screen" onchange="saveV21()"><span class="slider"></span></label></div><div class="card-row"><span data-lang="display-label">显示推荐结果</span> <small class="hint"><span data-lang="hint-display">对话中展示匹配结果</span></small><label class="switch"><input type="checkbox" id="ssr-display" onchange="saveV21()"><span class="slider"></span></label></div></div>
      </div>
    </div>
  </main>
</div>

<div class="modal" id="modal"><div class="modal-box"><h2 id="modal-title" data-lang="edit-rule">编辑规则</h2><label data-lang="edit-pattern">匹配模式（正则）</label><input id="edit-pattern"><label data-lang="edit-skills">匹配技能（逗号分隔）</label><textarea id="edit-skills"></textarea><label data-lang="edit-phrases">阶段标签（逗号分隔）</label><input id="edit-phases" placeholder="DISCOVER,PLAN,BUILD,VERIFY"><div class="modal-actions"><button class="btn btn-danger btn-sm" id="modal-delete-btn" style="display:none;margin-right:auto" onclick="deleteRule()" data-lang="delete-btn">删除</button><button class="btn" onclick="closeModal()" data-lang="cancel">取消</button><button class="btn btn-accent" onclick="saveRule()" data-lang="save-btn">保存</button></div></div></div>
<div class="toast" id="toast"></div>

t to apply)","gate-model-title":"Gate Model","emb-title":"Embedding Model","behavior-title":"Behavior","gate-enable":"Enable Gate","save-rebuild":"Save (rebuild index)","hint-llm-screen":"LLM re-screens A-layer matches","hint-display":"Show match results in chat","llm-screen-label":"LLM Screening","display-label":"Show Results","toast-fill":"Please fill all fields","toast-update":"Updated","toast-add":"Added","toast-delete":"Deleted","toast-reset":"Reset","toast-save":"Saved","toast-save-restart":"Saved, restart to apply","total-hits":"Total Hits","active-rules":"Active Rules","hit-rate":"Hit Rate","hit-rate-sub":"Hit Rate","total-hits-sub":"Total matches","active-rules-sub":"A-layer rules","rules-showing":"Showing","show-all":"Show all","more":"more","rules-of":"of","btn-edit":"Edit","no-results":"No matching rules","btn-delete":"Delete"}};
function t(k){return (i18n[lang]||i18n.zh)[k]||k}
var currentTab="rules";function updateBreadcrumb(){el("breadcrumb").textContent=t("brand")+" / "+t("tab-"+currentTab)}function toggleLang(){lang=lang==="zh"?"en":"zh";localStorage.setItem("ssr-lang",lang);document.title=t("brand");el("btn-lang").textContent=lang==="zh"?"EN":"中文";document.querySelectorAll("[data-lang]").forEach(function(e){e.textContent=t(e.getAttribute("data-lang"))});document.querySelectorAll("[data-lang-placeholder]").forEach(function(e){e.placeholder=t(e.getAttribute("data-lang-placeholder"))});el("live-status").textContent=paused?t("paused"):t("running");updateBreadcrumb();render();loadStats()}
function toggleTheme(){var b=document.body,cur=b.getAttribute("data-theme")||"dark",nxt=cur==="dark"?"light":"dark";b.setAttribute("data-theme",nxt);el("btn-theme").textContent=nxt==="dark"?"☀":"◉";localStorage.setItem("ssr-theme",nxt)}
function switchTab(name){currentTab=name;document.querySelectorAll(".tab").forEach(function(t,i){t.classList.toggle("active",(i===0&&name==="rules")||(i===1&&name==="config"))});document.querySelectorAll(".tab-content").forEach(function(c){c.classList.toggle("active",c.id==="tab-"+name)});updateBreadcrumb();if(name==="rules"){render();loadStats()}}

async function loadConfig(){var r=await fetch("/api/config");var c=await r.json();el("pause-switch").checked=!c.enabled;paused=!c.enabled;el("live-status").textContent=paused?t("paused"):t("running");document.querySelector('input[name="mode"][value="'+c.mode+'"]').checked=true;document.querySelector('input[name="scan"][value="'+c.scan+'"]').checked=true;el("b-provider").value=c.b_provider||"main";el("b-model").value=c.b_model||"";el("b-url").value=c.b_url||"";el("b-timeout").value=c.b_timeout||30;el("b-key").value=c.b_key||"";el("gate-provider").value=c.gate_provider||"ollama";mainModelName=c.main_model||"";el("gate-model").value=c.gate_model||(c.gate_provider==="main"?c.main_model:"");el("gate-enabled").checked=!!c.gate_enabled;el("emb-provider").value=c.emb_provider||"";el("emb-model").value=c.emb_model||"";el("emb-url").value=c.emb_url||"";el("emb-key").value=c.emb_key||"";el("llm-screen").checked=!!c.llm_screen;el("ssr-display").checked=!!c.display;loadEmbModels();el("pulse").className=c.enabled?"dot on":"dot off"}
function onBProviderChange(){var p=el("b-provider").value;el("b-model").disabled=p==="main";if(p==="main")el("b-model").value=mainModelName;el("b-url").disabled=p==="main";el("b-key").disabled=p==="main"}
function onGateProviderChange(){var p=el("gate-provider").value;if(p==="main")el("gate-model").value=mainModelName}
async function saveB(){await fetch("/api/config",{method:"POST",body:JSON.stringify({provider:el("b-provider").value,model:el("b-model").value,base_url:el("b-url").value,timeout:parseInt(el("b-timeout").value)||30,api_key:el("b-key").value})});toast(t("toast-save-restart"))}
async function saveGate(){var p=el("gate-provider").value,m=el("gate-model").value,e=el("gate-enabled").checked;await fetch("/api/config",{method:"POST",body:JSON.stringify({gate_provider:p,gate_model:m,gate_enabled:e})});toast(t("toast-save-restart"))}
async function saveEmb(){var p=el("emb-provider").value,m=el("emb-model").value;var d={emb_model:m,emb_provider:p,emb_url:el("emb-url").value,emb_key:el("emb-key").value};await fetch("/api/config",{method:"POST",body:JSON.stringify(d)});toast(t("toast-save"))}
async function saveV21(){var d={llm_screen:el("llm-screen").checked,display:el("ssr-display").checked};await fetch("/api/config",{method:"POST",body:JSON.stringify(d)});toast(t("toast-save"))}
async function saveMode(){var m=document.querySelector('input[name="mode"]:checked').value;await fetch("/api/config",{method:"POST",body:JSON.stringify({mode:m})});toast(t("toast-save"))}
async function saveScan(){var s=document.querySelector('input[name="scan"]:checked').value;await fetch("/api/config",{method:"POST",body:JSON.stringify({scan_mode:s})});toast(t("toast-save"))}
async function togglePause(){paused=el("pause-switch").checked;await fetch("/api/config",{method:"POST",body:JSON.stringify({enabled:!paused})});el("live-status").textContent=paused?t("paused"):t("running");el("pulse").className=paused?"dot off":"dot on"}
async function loadRules(){var r=await fetch("/api/rules");var d=await r.json();if(Array.isArray(d)){rules={};d.forEach(function(item){rules[item.pattern]=item});rulesOrder=Object.keys(rules).sort()}else{rules=d;rulesOrder=Object.keys(d).sort()}}
async function loadStats(){var r=await fetch("/api/stats");var s=await r.json();var h=Math.round(s.hit_rate||0);el("stats-bar").innerHTML='<div class="stat-card"><div class="stat-label">'+t("total-hits")+'</div><div class="stat-value">'+(s.total_hits||0)+'</div><div class="stat-sub">'+t("total-hits-sub")+'</div></div><div class="stat-card"><div class="stat-label">'+t("active-rules")+'</div><div class="stat-value">'+(s.rules_count||0)+'</div><div class="stat-sub">'+t("active-rules-sub")+'</div></div><div class="stat-card"><div class="stat-label">'+t("hit-rate")+'</div><div class="stat-value">'+h+'%</div><div class="stat-sub">'+t("hit-rate-sub")+'</div></div>'}
var showAll=false;
function render(){
  var q=(el("search").value||"").toLowerCase();
  var rows=rulesOrder.filter(function(k){return !q||k.toLowerCase().indexOf(q)>=0||(rules[k].skills||[]).some(function(kw){return kw&&kw.toLowerCase().indexOf(q)>=0})});
  rows.sort(function(a,b){return (rules[b].hits||0)-(rules[a].hits||0)});
  var shown=showAll?rows:rows.slice(0,10);
  var hidden=rows.length-shown.length;
  el("search-info").textContent=t("rules-showing")+" "+shown.length+(hidden>0?" (+"+hidden+" "+t("more")+")":"")+" "+t("rules-of")+" "+rulesOrder.length+" "+t("active-rules");
  if(!rows.length){el("cards-grid").innerHTML='<div class="empty">'+t("no-results")+'</div>';return}
  var h="";
  shown.forEach(function(k,i){
    var r=rules[k];var hits=r.hits||0;
    h+='<div class="rule-card"><div class="rule-left"><span class="rule-pattern">'+k+'</span></div><span class="rule-hits'+(hits>100?' hot':'')+'">'+hits+'</span><div class="rule-actions"><button class="btn btn-sm" onclick="openEditModal(\''+k.replace(/'/g,"\\'")+'\')">'+t("btn-edit")+'</button><button class="btn btn-sm btn-danger" onclick="deleteRuleByKey(\''+k.replace(/'/g,"\\'")+'\')">'+t("btn-delete")+'</button></div></div>'
  });
  if(hidden>0&&!q)h+='<div class="show-more" onclick="showAll=true;render()">'+t("show-all")+' '+rows.length+' '+t("active-rules")+'</div>';
  el("cards-grid").innerHTML=h;
}
function openAddModal(){editingPattern=null;el("modal-title").textContent=t("add-rule");el("edit-pattern").value="";el("edit-skills").value="";el("edit-phases").value="";el("modal-delete-btn").style.display="none";el("modal").classList.add("show")}
function openEditModal(k){editingPattern=k;var r=rules[k];el("modal-title").textContent=t("edit-rule");el("edit-pattern").value=k;el("edit-skills").value=(r.skills||[]).join(", ");el("edit-phases").value=(r.phases||[]).join(",");el("modal-delete-btn").style.display="inline-flex";el("modal").classList.add("show")}
function closeModal(){el("modal").classList.remove("show")}
async function saveRule(){var p=el("edit-pattern").value.trim(),s=el("edit-skills").value.trim(),ph=el("edit-phases").value.trim();if(!p){toast(t("toast-fill"),"error");return}var keywords=s?s.split(",").map(function(x){return x.trim()}):[];var phases=ph?ph.split(",").map(function(x){return x.trim()}):["DISCOVER"];if(editingPattern&&editingPattern!==p){await fetch("/api/rules/"+encodeURIComponent(editingPattern),{method:"DELETE"})}var r={skills:keywords,phases:phases,hits:editingPattern?rules[editingPattern]?.hits||0:0,last_hit:"",source:"manual",priority:10};await fetch("/api/rules/"+encodeURIComponent(p),{method:"PUT",body:JSON.stringify(r)});closeModal();await loadRules();render();loadStats();toast(editingPattern?t("toast-update"):t("toast-add"))}
async function deleteRuleByKey(k){if(!confirm(t("delete-btn")+"?"))return;await fetch("/api/rules/"+encodeURIComponent(k),{method:"DELETE"});await loadRules();render();loadStats();toast(t("toast-delete"))}
async function deleteRule(){if(!editingPattern)return;await deleteRuleByKey(editingPattern);closeModal()}
async function resetRules(){if(!confirm(t("reset-rules")+"?"))return;await fetch("/api/rules/reset",{method:"POST"});await loadRules();render();loadStats();toast(t("toast-reset"))}
async function loadEmbModels(){try{var r=await fetch("/api/models");var m=await r.json();var list=el("emb-ollama-list");list.innerHTML="";(m.ollama||[]).forEach(function(n){list.innerHTML+='<option value="'+n+'">'})}catch(e){}}
function toast(msg,type){type=type||"success";var t=el("toast");t.textContent=msg;t.className="toast show "+(type||"");setTimeout(function(){t.className="toast"},2400)}
(function init(){
  var theme=localStorage.getItem("ssr-theme")||"dark";document.body.setAttribute("data-theme",theme);
  el("btn-theme").textContent=theme==="dark"?"☀":"◉";el("btn-lang").textContent=lang==="zh"?"EN":"中文";document.title=t("brand");updateBreadcrumb();
  el("modal").addEventListener("click",function(e){if(e.target===el("modal"))closeModal()});
  loadConfig();loadRules().then(function(){render();loadStats()});
  setInterval(function(){el("clock").textContent=new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit",second:"2-digit"})},1000);
})();
</script>
