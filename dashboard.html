<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSR Dashboard · 智配路由</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0d1117;color:#c9d1d9;max-width:1100px;margin:0 auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:22px;font-weight:600}
.stats{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.stat{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px 18px;min-width:140px}
.stat-label{font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:.5px}
.stat-value{font-size:24px;font-weight:600;margin-top:4px}
.toolbar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.toolbar input,.toolbar button{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:8px 14px;color:#c9d1d9;font-size:13px}
.toolbar input{flex:1;min-width:200px}
.toolbar button{cursor:pointer;background:#238636;border-color:#238636;color:#fff}
.toolbar button.danger{background:#da3633;border-color:#da3633}
.toolbar button:hover{opacity:.9}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 14px;border-bottom:1px solid #30363d;color:#8b949e;font-weight:500;cursor:pointer;user-select:none}
td{padding:8px 14px;border-bottom:1px solid #21262d}
tr:hover{background:#161b22}
.pattern{font-family:monospace;font-size:12px;color:#58a6ff;max-width:300px;word-break:break-all}
.skills{color:#7ee787}
.hits{color:#d2991d;font-weight:600}
.actions{display:flex;gap:8px}
.actions button{background:none;border:1px solid #30363d;border-radius:4px;padding:3px 8px;color:#8b949e;cursor:pointer;font-size:11px}
.actions button:hover{color:#c9d1d9;border-color:#58a6ff}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);justify-content:center;align-items:center;z-index:100}
.modal.show{display:flex}
.modal-content{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:24px;width:560px;max-height:80vh;overflow-y:auto}
.modal-content h2{margin-bottom:16px}
.modal-content label{display:block;font-size:12px;color:#8b949e;margin-bottom:4px;margin-top:12px}
.modal-content input,.modal-content textarea{width:100%;background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:8px 12px;color:#c9d1d9;font-size:13px}
.modal-content textarea{min-height:60px;resize:vertical}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;bottom:20px;right:20px;background:#238636;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;display:none;z-index:200}
.toast.show{display:block}
.toast.error{background:#da3633}
</style>
</head>
<body>
<header>
<h1>智配路由 · A 层规则管理</h1>
<div style="color:#8b949e;font-size:12px">SSR Dashboard v0.1.0</div>
</header>

<div class="stats" id="stats"></div>

<div class="toolbar">
<input id="search" placeholder="搜索规则…" oninput="render()">
<button onclick="openModal()">+ 添加规则</button>
<button onclick="location.reload()">↻ 刷新</button>
</div>

<table>
<thead>
<tr>
<th>模式</th>
<th>匹配 Skill</th>
<th style="width:60px">命中</th>
<th style="width:120px">操作</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<div class="modal" id="modal">
<div class="modal-content">
<h2 id="modalTitle">添加规则</h2>
<label>匹配模式（正则）</label>
<input id="editPattern" placeholder="如: debug|报错|KeyError">
<label>Skill 列表（逗号分隔）</label>
<textarea id="editSkills" placeholder="如: diagnose, systematic-debugging"></textarea>
<label>阶段标签（逗号分隔，可选）</label>
<input id="editPhases" placeholder="如: DISCOVER, DISCOVER">
<div class="modal-actions">
<button class="danger" id="btnDelete" style="display:none" onclick="del()">删除</button>
<button onclick="closeModal()">取消</button>
<button onclick="save()">保存</button>
</div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
let rules=[],editing=null;

async function load(){
  const r=await fetch('/api/rules');
  rules=await r.json();
  render();
}

function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const filtered=rules.filter(r=>
    r.pattern.toLowerCase().includes(q)||
    r.skills.map(s=>typeof s==='string'?s:s.name).join(' ').toLowerCase().includes(q)
  );
  document.getElementById('stats').innerHTML=
    `<div class=stat><div class=stat-label>规则总数</div><div class=stat-value>${rules.length}</div></div>`+
    `<div class=stat><div class=stat-label>累计命中</div><div class=stat-value>${rules.reduce((s,r)=>s+(r.hits||0),0)}</div></div>`+
    `<div class=stat><div class=stat-label>命中>0</div><div class=stat-value>${rules.filter(r=>r.hits>0).length}</div></div>`;

  document.getElementById('tbody').innerHTML=filtered.map(r=>{
    const skills=r.skills.map(s=>typeof s==='string'?s:s.name).join(', ');
    return `<tr>
      <td class=pattern>${esc(r.pattern)}</td>
      <td class=skills>${esc(skills)}</td>
      <td class=hits>${r.hits||0}</td>
      <td class=actions>
        <button onclick="edit('${esc(r.pattern)}')">✏ 编辑</button>
        <button onclick="delRule('${esc(r.pattern)}')">🗑</button>
      </td>
    </tr>`;
  }).join('');
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function save(){
  const pat=document.getElementById('editPattern').value.trim();
  const skills=document.getElementById('editSkills').value.split(',').map(s=>s.trim()).filter(Boolean);
  const phases=document.getElementById('editPhases').value.split(',').map(s=>s.trim()).filter(Boolean);

  if(!pat||!skills.length){toast('请填写模式和 Skill','error');return;}

  const skillObjs=skills.map((s,i)=>({name:s,phase:phases[i]||''}));

  if(editing){
    const r=await fetch('/api/rules/'+encodeURIComponent(editing),{
      method:'PUT',body:JSON.stringify({pattern:pat,skills:skillObjs})
    });
    if((await r.json()).ok)toast('已更新');
  }else{
    const r=await fetch('/api/rules',{
      method:'POST',body:JSON.stringify({pattern:pat,skills:skillObjs})
    });
    if((await r.json()).ok)toast('已添加');
  }
  closeModal();load();
}

async function del(){
  if(!editing)return;
  await fetch('/api/rules/'+encodeURIComponent(editing),{method:'DELETE'});
  toast('已删除');closeModal();load();
}

async function delRule(pat){
  if(!confirm('确定删除规则 "'+pat+'" ？'))return;
  await fetch('/api/rules/'+encodeURIComponent(pat),{method:'DELETE'});
  toast('已删除');load();
}

function edit(pat){
  editing=pat;
  const r=rules.find(r=>r.pattern===pat);
  document.getElementById('modalTitle').textContent='编辑规则';
  document.getElementById('editPattern').value=r.pattern;
  document.getElementById('editSkills').value=r.skills.map(s=>typeof s==='string'?s:s.name).join(', ');
  document.getElementById('editPhases').value=r.skills.map(s=>typeof s==='string'?'':s.phase||'').join(', ');
  document.getElementById('btnDelete').style.display='inline-block';
  document.getElementById('modal').classList.add('show');
}

function openModal(){
  editing=null;
  document.getElementById('modalTitle').textContent='添加规则';
  document.getElementById('editPattern').value='';
  document.getElementById('editSkills').value='';
  document.getElementById('editPhases').value='';
  document.getElementById('btnDelete').style.display='none';
  document.getElementById('modal').classList.add('show');
}

function closeModal(){
  document.getElementById('modal').classList.remove('show');
}

function toast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show '+(type||'');
  setTimeout(()=>t.className='toast',2000);
}

document.getElementById('modal').addEventListener('click',function(e){
  if(e.target===this)closeModal();
});

load();
</script>
</body>
</html>
