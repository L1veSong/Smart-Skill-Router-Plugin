<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title id="page-title">智配路由 · 仪表盘</title>
<style>
:root{--bg:#0f1218;--card:#161b22;--border:#2a3040;--text:#c9d1d9;--muted:#8b949e;--accent:#58a6ff;--green:#238636;--red:#da3633;--amber:#d2991d;--radius:10px;--ease:cubic-bezier(.4,0,.2,1)}
[data-theme=light]{--bg:#fff;--card:#f6f8fa;--border:#d0d7de;--text:#1f2328;--muted:#656d76;--accent:#0969da;--green:#1a7f37;--red:#cf222e;--amber:#9a6700}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);max-width:1200px;margin:0 auto;padding:24px;transition:background .3s,color .3s,opacity .15s}
.lang-switching{opacity:.5;pointer-events:none}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;animation:slideIn .4s var(--ease)}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
h1{font-size:24px;font-weight:700;letter-spacing:-.3px;background:linear-gradient(135deg,var(--accent),#7ee787);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-right{display:flex;gap:10px;align-items:center;font-size:12px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,to{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.3)}}
.tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:2px solid var(--border)}
.tab{padding:10px 22px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border:none;background:none;position:relative;transition:.2s}
.tab:hover{color:var(--text)}.tab.active{color:var(--accent)}
.tab.active::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:2px;background:var(--accent);animation:tabIn .3s var(--ease)}
@keyframes tabIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tab-content{display:none;animation:fadeIn .3s var(--ease)}.tab-content.active{display:block;animation:fadeIn .25s var(--ease)}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;transition:.2s}
.stat:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.stat-value{font-size:28px;font-weight:700;margin-top:6px;transition:.3s}
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.toolbar input,.toolbar select{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 14px;color:var(--text);font-size:13px;flex:1;min-width:180px;transition:border-color .2s}
.toolbar input:focus,.toolbar select:focus{outline:none;border-color:var(--accent)}
.btn{padding:8px 16px;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{filter:brightness(1.1)}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{filter:brightness(1.1)}
.btn-outline{background:var(--card);border:1px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--accent)}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{filter:brightness(1.1)}.btn-sm{padding:4px 10px;font-size:11px}
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
th{text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
td{padding:9px 14px;border-bottom:1px solid rgba(127,127,127,.1);transition:background .15s}
tr:hover td{background:rgba(88,166,255,.03)}tr{animation:rowIn .3s var(--ease) both}
@keyframes rowIn{from{opacity:0;transform:translateX(-8px)}}
.pattern{font-family:monospace;font-size:12px;color:var(--accent);word-break:break-all}
.skills{color:#7ee787;font-size:12px}.hits{color:var(--amber);font-weight:700;font-size:14px}
.actions{display:flex;gap:6px}
.empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px;line-height:1.8;animation:fadeIn .5s var(--ease)}
.empty-icon{font-size:40px;display:block;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:16px}
.card h2{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.form-group{margin-bottom:14px}.form-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
.form-group input,.form-group select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 13px;color:var(--text);font-size:13px;transition:border-color .2s}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--accent)}
.form-row{display:flex;gap:12px}.form-row .form-group{flex:1}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(127,127,127,.08)}.toggle:last-child{border-bottom:none}
.toggle-label{font-size:13px;font-weight:500}.toggle-desc{font-size:11px;color:var(--muted);margin-top:3px}
.toggle-switch{position:relative;width:48px;height:26px;flex-shrink:0}.toggle-switch input{display:none}
.toggle-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:var(--border);border-radius:13px;transition:.25s var(--ease)}
.toggle-slider:before{content:"";position:absolute;height:20px;width:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.25s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.2)}
input:checked+.toggle-slider{background:var(--accent)}input:checked+.toggle-slider:before{transform:translateX(22px)}
.disabled-overlay{position:relative}.disabled-overlay::after{content:'';position:absolute;inset:0;background:var(--bg);opacity:.4;border-radius:var(--radius);pointer-events:none}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);justify-content:center;align-items:center;z-index:100;animation:fadeIn .2s}
.modal.show{display:flex}.modal-content{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px;width:580px;max-height:80vh;overflow-y:auto;animation:modalIn .3s var(--ease)}
@keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-content h2{margin-bottom:18px}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 22px;border-radius:10px;font-size:13px;font-weight:500;display:none;z-index:200;animation:toastIn .3s var(--ease);box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast.show{display:block}.toast.success{background:var(--green);color:#fff}.toast.error{background:var(--red);color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
<h1 id="main-title">智配路由 · 仪表盘</h1>
<div class="header-right">
<span class="pulse"></span><span id="live-status">运行中</span>
<span style="margin-left:12px" id="clock">--:--:--</span>
<button class="btn btn-outline btn-sm" onclick="toggleLang()" id="btn-lang">EN</button>
<button class="btn btn-outline btn-sm" onclick="toggleTheme()" id="btn-theme">☀</button>
</div>
</header>
<div class="tabs">
<button class="tab active" data-tab="rules" onclick="switchTab('rules')">📋 <span data-lang="tab-rules">规则管理</span></button>
<button class="tab" data-tab="config" onclick="switchTab('config')">⚙️ <span data-lang="tab-config">引擎配置</span></button>
</div>
<div class="tab-content active" id="tab-rules">
<div class="stats" id="stats"></div>
<div class="toolbar">
<input id="search" data-lang-placeholder="search" placeholder="搜索规则…" oninput="render()">
<button class="btn btn-green" onclick="openRuleModal()">+ <span data-lang="add-rule">添加规则</span></button>
<button class="btn btn-outline" onclick="loadRules();render()">↻</button>
<button class="btn btn-outline btn-danger" onclick="resetRules()" data-lang="reset-rules" style="margin-left:auto">🗑 重置</button>
</div>
<div id="rules-empty" class="empty"><span class="empty-icon">📭</span><span data-lang="empty-rules">还没有规则。B 层会自动学习。</span></div>
<table id="rules-table"><thead><tr>
<th style="width:48%" data-lang="col-pattern">匹配模式</th><th style="width:32%" data-lang="col-skills">Skill</th><th style="width:8%" data-lang="col-hits">命中</th><th style="width:12%" data-lang="col-actions">操作</th>
</tr></thead><tbody id="tbody"></tbody></table>
</div>
<div class="tab-content" id="tab-config">
<div class="card"><h2>🔌 <span data-lang="pause">暂停开关</span></h2>
<div class="toggle"><div><div class="toggle-label" data-lang="pause-label">暂停 SSR</div><div class="toggle-desc" data-lang="pause-desc">暂停后不推荐任何 Skill</div></div>
<label class="toggle-switch"><input type="checkbox" id="pause-switch" onchange="togglePause()"><span class="toggle-slider"></span></label></div></div>
<div class="card" id="config-active-card"><h2>📡 <span data-lang="mode">推荐模式</span></h2>
<div class="toggle"><div><div class="toggle-label" data-lang="suggest">推荐模式</div><div class="toggle-desc" data-lang="suggest-desc">AI 看到建议可自主决定</div></div>
<label class="toggle-switch"><input type="radio" name="mode" value="suggest" onchange="saveMode()"><span class="toggle-slider"></span></label></div>
<div class="toggle"><div><div class="toggle-label" data-lang="enforce">强制模式</div><div class="toggle-desc" data-lang="enforce-desc">注入 MUST-LOAD 指令</div></div>
<label class="toggle-switch"><input type="radio" name="mode" value="enforce" onchange="saveMode()"><span class="toggle-slider"></span></label></div></div>
<div class="card" id="config-scan-card"><h2>🔄 <span data-lang="scan">扫描策略</span></h2>
<div class="toggle"><div><div class="toggle-label" data-lang="scan-startup">启动时扫描</div><div class="toggle-desc" data-lang="scan-startup-desc">零延迟，新装 Skill 需重启</div></div>
<label class="toggle-switch"><input type="radio" name="scan" value="startup" onchange="saveScan()"><span class="toggle-slider"></span></label></div>
<div class="toggle"><div><div class="toggle-label" data-lang="scan-every">每次提问扫描</div><div class="toggle-desc" data-lang="scan-every-desc">新装 Skill 即时感知</div></div>
<label class="toggle-switch"><input type="radio" name="scan" value="every_turn" onchange="saveScan()"><span class="toggle-slider"></span></label></div></div>
<div class="card" id="config-b-card"><h2>🖥 <span data-lang="b-layer">B 层后端</span></h2>
<div class="form-row"><div class="form-group"><label data-lang="provider">后端类型</label>
<select id="b-provider" onchange="onProviderChange()">
<option value="main">main</option><option value="openai">openai</option><option value="ollama">ollama</option><option value="lmstudio">lmstudio</option><option value="llamacpp">llamacpp</option>
</select></div><div class="form-group"><label data-lang="model-label">模型</label><input id="b-model"></div></div>
<div class="form-row"><div class="form-group"><label>Base URL</label><input id="b-url"></div><div class="form-group"><label>API Key</label><input id="b-key" type="password"></div></div>
<div class="form-group"><label>Timeout (s)</label><input id="b-timeout" type="number" value="30"></div>
<button class="btn btn-primary" onclick="saveBLayer()">💾 <span data-lang="save">保存（重启生效）</span></button><span id="b-status" style="margin-left:12px;font-size:12px;color:var(--muted)"></span></div>
</div>
<div class="modal" id="modal"><div class="modal-content">
<h2 id="modalTitle">添加规则</h2>
<div class="form-group"><label data-lang="edit-pattern">匹配模式（正则）</label><input id="editPattern"></div>
<div class="form-group"><label data-lang="edit-skills">Skill（逗号分隔）</label><input id="editSkills"></div>
<div class="form-group"><label data-lang="edit-phases">阶段标签（逗号分隔）</label><input id="editPhases"></div>
<div class="modal-actions">
<button class="btn btn-danger" id="btnDelete" style="display:none" onclick="delRule()" data-lang="delete-btn">删除</button>
<button class="btn btn-outline" onclick="closeModal()" data-lang="cancel">取消</button>
<button class="btn btn-green" onclick="saveRule()" data-lang="save-btn">保存</button>
</div></div></div>
<div class="toast" id="toast"></div>
<script>
var rules=[],editing=null,lang="zh",paused=false;
var i18n={zh:{"tab-rules":"规则管理","tab-config":"引擎配置",search:"搜索规则…","add-rule":"添加规则","edit-rule":"编辑规则","reset-rules":"重置","empty-rules":"还没有规则。B 层会自动学习。","col-pattern":"匹配模式","col-skills":"Skill","col-hits":"命中","col-actions":"操作",pause:"暂停开关","pause-label":"暂停 SSR","pause-desc":"暂停后不推荐任何 Skill",mode:"推荐模式",suggest:"推荐模式","suggest-desc":"AI 看到建议可自主决定",enforce:"强制模式","enforce-desc":"注入 MUST-LOAD 指令",scan:"扫描策略","scan-startup":"启动时扫描","scan-startup-desc":"零延迟，新装 Skill 需重启","scan-every":"每次提问扫描","scan-every-desc":"新装 Skill 即时感知","b-layer":"B 层后端",provider:"后端类型","model-label":"模型",save:"保存（重启生效）","edit-pattern":"匹配模式（正则）","edit-skills":"Skill（逗号分隔）","edit-phases":"阶段标签（逗号分隔）","delete-btn":"删除",cancel:"取消","save-btn":"保存",running:"运行中",paused:"已暂停","toast-fill":"请填写完整","toast-update":"更新成功","toast-add":"添加成功","toast-delete":"已删除","toast-reset":"已重置","toast-save":"已保存","toast-save-restart":"已保存，重启生效","total-hits":"累计命中","active-rules":"活跃规则"},en:{"tab-rules":"Rules","tab-config":"Config",search:"Search rules…","add-rule":"Add Rule","edit-rule":"Edit Rule","reset-rules":"Reset","empty-rules":"No rules yet.","col-pattern":"Pattern","col-skills":"Skills","col-hits":"Hits","col-actions":"Actions",pause:"Pause","pause-label":"Pause SSR","pause-desc":"Stop all recommendations",mode:"Mode",suggest:"Suggest","suggest-desc":"AI decides whether to load",enforce:"Enforce","enforce-desc":"MUST-LOAD directive",scan:"Scan Strategy","scan-startup":"On startup","scan-startup-desc":"Zero latency","scan-every":"Every turn","scan-every-desc":"Instant detection","b-layer":"B-Layer Backend",provider:"Provider","model-label":"Model",save:"Save (restart needed)","edit-pattern":"Pattern (regex)","edit-skills":"Skills (comma-sep)","edit-phases":"Phases (comma-sep)","delete-btn":"Delete",cancel:"Cancel","save-btn":"Save",running:"Running",paused:"Paused","toast-fill":"Please fill all fields","toast-update":"Updated","toast-add":"Added","toast-delete":"Deleted","toast-reset":"Reset","toast-save":"Saved","toast-save-restart":"Saved, restart needed","total-hits":"Total Hits","active-rules":"Active"}};
function t(k){return (i18n[lang]||i18n.zh)[k]||k}
function toggleLang(){document.body.classList.add("lang-switching");setTimeout(function(){lang=lang==="zh"?"en":"zh";document.getElementById("btn-lang").textContent=lang==="zh"?"EN":"中";document.querySelectorAll("[data-lang]").forEach(function(e){e.textContent=t(e.getAttribute("data-lang"))});document.querySelectorAll("[data-lang-placeholder]").forEach(function(e){e.placeholder=t(e.getAttribute("data-lang-placeholder"))});document.getElementById("page-title").textContent=lang==="zh"?"智配路由 · 仪表盘":"Smart Skill Router · Dashboard";document.getElementById("main-title").textContent=lang==="zh"?"智配路由 · 仪表盘":"Smart Skill Router · Dashboard";document.getElementById("live-status").textContent=paused?t("paused"):t("running");render();document.body.classList.remove("lang-switching")},120)}
function toggleTheme(){var b=document.body,cur=b.getAttribute("data-theme")||"dark",nxt=cur==="dark"?"light":"dark";b.setAttribute("data-theme",nxt);document.getElementById("btn-theme").textContent=nxt==="dark"?"☀":"🌙";localStorage.setItem("ssr-theme",nxt)}
function switchTab(n){document.querySelectorAll(".tab").forEach(function(t){t.classList.toggle("active",t.getAttribute("data-tab")===n)});document.querySelectorAll(".tab-content").forEach(function(c){c.classList.remove("active")});var active=document.getElementById("tab-"+n);if(active){void active.offsetWidth;active.classList.add("active")}}
async function loadRules(){try{var r=await fetch("/api/rules");rules=await r.json()}catch(e){rules=[]}document.getElementById("rules-empty").style.display=rules.length?"none":"block";document.getElementById("rules-table").style.display=rules.length?"":"none";render()}
function render(){var q=document.getElementById("search").value.toLowerCase();var f=rules.filter(function(r){return(r.pattern||"").toLowerCase().includes(q)||(r.skills||[]).map(function(s){return typeof s==="string"?s:s.name}).join(" ").toLowerCase().includes(q)});document.getElementById("stats").innerHTML='<div class=stat><div class=stat-label>'+t("col-hits")+'</div><div class=stat-value>'+rules.length+'</div></div><div class=stat><div class=stat-label>'+t("total-hits")+'</div><div class=stat-value>'+rules.reduce(function(s,r){return s+(r.hits||0)},0)+'</div></div><div class=stat><div class=stat-label>'+t("active-rules")+'</div><div class=stat-value>'+rules.filter(function(r){return r.hits>0}).length+'</div></div>';document.getElementById("tbody").innerHTML=f.map(function(r,i){return'<tr style=animation-delay:'+i*.02+'s><td class=pattern>'+e(r.pattern)+'</td><td class=skills>'+e((r.skills||[]).map(function(s){return typeof s==="string"?s:s.name}).join(", "))+'</td><td class=hits>'+(r.hits||0)+'</td><td class=actions><button class="btn btn-outline btn-sm" onclick="editRule(\''+e(r.pattern)+'\')">✏</button><button class="btn btn-outline btn-sm" style=color:var(--red) onclick="delRule2(\''+e(r.pattern)+'\')">🗑</button></td></tr>'}).join("")}
function e(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
async function saveRule(){var p=document.getElementById("editPattern").value.trim();var ss=document.getElementById("editSkills").value.split(",").map(function(s){return s.trim()}).filter(Boolean);var ps=document.getElementById("editPhases").value.split(",").map(function(s){return s.trim()}).filter(Boolean);if(!p||!ss.length){toast(t("toast-fill"),"error");return}var so=ss.map(function(s,i){return{name:s,phase:ps[i]||""}});if(editing){await fetch("/api/rules/"+encodeURIComponent(editing),{method:"PUT",body:JSON.stringify({pattern:p,skills:so})});toast(t("toast-update"))}else{await fetch("/api/rules",{method:"POST",body:JSON.stringify({pattern:p,skills:so})});toast(t("toast-add"))}closeModal();loadRules()}
async function delRule(){if(!editing)return;await fetch("/api/rules/"+encodeURIComponent(editing),{method:"DELETE"});toast(t("toast-delete"));closeModal();loadRules()}
async function delRule2(pat){if(!confirm(t("delete-btn")+' "'+pat+'" ？'))return;await fetch("/api/rules/"+encodeURIComponent(pat),{method:"DELETE"});toast(t("toast-delete"));loadRules()}
async function resetRules(){if(!confirm(t("reset-rules")+"？"))return;await fetch("/api/rules/reset",{method:"POST"});toast(t("toast-reset"));loadRules()}
function editRule(pat){editing=pat;var r=rules.find(function(r){return r.pattern===pat});document.getElementById("modalTitle").textContent=t("edit-rule");document.getElementById("editPattern").value=r.pattern;document.getElementById("editSkills").value=(r.skills||[]).map(function(s){return typeof s==="string"?s:s.name}).join(", ");document.getElementById("editPhases").value=(r.skills||[]).map(function(s){return typeof s==="string"?"":s.phase||""}).join(", ");document.getElementById("btnDelete").style.display="inline-flex";document.getElementById("modal").classList.add("show")}
function openRuleModal(){editing=null;document.getElementById("modalTitle").textContent=t("add-rule");document.getElementById("editPattern").value="";document.getElementById("editSkills").value="";document.getElementById("editPhases").value="";document.getElementById("btnDelete").style.display="none";document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
var defaults={main:{url:"",model:""},openai:{url:"https://api.openai.com/v1",model:"gpt-4o-mini"},ollama:{url:"http://localhost:11434/v1",model:"qwen2.5:3b"},lmstudio:{url:"http://localhost:1234/v1",model:""},llamacpp:{url:"http://localhost:8080/v1",model:""}};
function onProviderChange(){var p=document.getElementById("b-provider").value;var d=defaults[p]||{};if(d.url)document.getElementById("b-url").value=d.url;if(d.model)document.getElementById("b-model").value=d.model;var m=p==="main";document.getElementById("b-url").disabled=m;document.getElementById("b-model").disabled=m;document.getElementById("b-key").disabled=m}
async function loadConfig(){try{var r=await fetch("/api/config");var c=await r.json();document.querySelector('input[name=mode][value="'+(c.mode||"suggest")+'"]').checked=true;document.querySelector('input[name=scan][value="'+(c.scan||"startup")+'"]').checked=true;document.getElementById("b-provider").value=c.b_provider||"main";document.getElementById("b-model").value=c.b_model||"";document.getElementById("b-url").value=c.b_url||"";document.getElementById("b-timeout").value=c.b_timeout||30;document.getElementById("b-key").value=c.b_key||"";document.getElementById("pause-switch").checked=!c.enabled;paused=!c.enabled;document.getElementById("live-status").textContent=paused?t("paused"):t("running");document.querySelector(".pulse").style.background=paused?"var(--amber)":"var(--green)";["config-active-card","config-scan-card","config-b-card"].forEach(function(id){var e=document.getElementById(id);if(paused)e.classList.add("disabled-overlay");else e.classList.remove("disabled-overlay")});onProviderChange()}catch(e){}}
async function togglePause(){paused=document.getElementById("pause-switch").checked;await fetch("/api/config",{method:"POST",body:JSON.stringify({enabled:!paused})});document.getElementById("live-status").textContent=paused?t("paused"):t("running");document.querySelector(".pulse").style.background=paused?"var(--amber)":"var(--green)";["config-active-card","config-scan-card","config-b-card"].forEach(function(id){var e=document.getElementById(id);if(paused)e.classList.add("disabled-overlay");else e.classList.remove("disabled-overlay")});toast(paused?t("paused"):t("running"))}
async function saveMode(){var m=document.querySelector("input[name=mode]:checked").value;await fetch("/api/config",{method:"POST",body:JSON.stringify({mode:m})});toast(t("toast-save"))}
async function saveScan(){var s=document.querySelector("input[name=scan]:checked").value;await fetch("/api/config",{method:"POST",body:JSON.stringify({scan:s})});toast(t("toast-save"))}
async function saveBLayer(){var p=document.getElementById("b-provider").value;var d={provider:p,model:document.getElementById("b-model").value,base_url:document.getElementById("b-url").value,timeout:parseInt(document.getElementById("b-timeout").value)||30};var k=document.getElementById("b-key").value;if(k)d.api_key=k;await fetch("/api/config",{method:"POST",body:JSON.stringify(d)});toast(t("toast-save-restart"))}
function toast(msg,type){type=type||"success";var t=document.getElementById("toast");t.textContent=msg;t.className="toast show "+type;setTimeout(function(){t.className="toast"},2200)}
function tick(){document.getElementById("clock").textContent=new Date().toLocaleTimeString("zh-CN",{hour12:false})}
document.getElementById("modal").addEventListener("click",function(e){if(e.target===document.getElementById("modal"))closeModal()});
var saved=localStorage.getItem("ssr-theme");if(saved==="light")toggleTheme();
window.addEventListener("load",function(){loadRules();loadConfig();tick();setInterval(tick,1000);setInterval(function(){loadRules();loadConfig()},30000)})
</script>
</body>
</html>
